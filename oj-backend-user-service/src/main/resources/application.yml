spring:
  application:
    name: oj-backend-user-service
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      server-addr: ${nacos.address}
    sentinel:
      transport:
        dashboard: ${sentinel.addr}   # Sentinel 控制台地址
      http-method-specify: true # 开启请求方式前缀
  # session 配置
  session:
    #  取消注释开启分布式 session（须先配置 Redis）
    store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.dataBase}
    username: ${mysql.userName}
    password: ${mysql.passWord}
  # Redis 配置
  redis:
    database: 1
    host: ${redis.host}
    port: ${redis.port}
    timeout: 5000
    password: ${redis.password}
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8112
  servlet:
    context-path: /api/user
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
        path: /api
feign:
  sentinel:
    enabled: true # 开启feign对sentinel的支持
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.wen.ojbackenduserservice.controller
